name: tests

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

# No job here runs tests/e2e/: those need real credentials and stay opt-in
# (`make test-e2e`, `make test-e2e-grpc`). pytest's default `-m` excludes them.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest tests/ -q --tb=short

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Type-check
        run: make typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  spec-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Check FR/SC/task cross-references
        run: make check-specs

  # A pull request that can break callers must say so in CHANGELOG.md. The
  # baseline is the merge base, so only this pull request's changes count.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Fail if CHANGELOG.md misses a breaking API surface change
        run: make check-changelog SINCE="$(git merge-base HEAD origin/${{ github.base_ref }})"

  # Regenerates at the schema commit in schema.lock, so upstream drift cannot
  # fail it. The scheduled schema-sync workflow moves that pin.
  generated-output-matches-schema-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Regenerate the SDK at the pinned schema commit
        run: make generate

      - name: Fail if generated output differs from what is committed
        run: |
          # --porcelain, not `git diff`, so a newly generated untracked file counts too.
          changed="$(git status --porcelain)"
          if [ -n "$changed" ]; then
            echo "::error::Regenerated output differs from the committed tree."
            echo "Differing paths:"
            echo "$changed"
            echo
            echo "This change altered generator output (scripts/, templates, or runtime"
            echo "modules the docs describe), or schema.lock names a commit the tree was"
            echo "not generated from. Run 'make generate' and commit the result."
            exit 1
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      # Builds from the committed tree, so a docs failure is never masked by
      # regeneration; the generated-output-matches-schema-pin job already covers
      # stale generated pages.
      - name: Build Sphinx docs, failing on any warning
        run: uv run sphinx-build -W --keep-going -b html docs/sphinx docs/build/html
