name: release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # hatch-vcs needs full history to read the tag

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Check the built version matches the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          built=$(ls dist/*.whl | sed -E 's|.*/kentik_api-([^-]+)-.*|\1|')
          if [ "$built" != "${TAG#v}" ]; then
            echo "Built version $built does not match tag $TAG" >&2
            exit 1
          fi
          # A pre-release flag on a final-style tag would publish as final.
          if [ "$PRERELEASE" = "true" ] && ! echo "$built" | grep -Eq '(a|b|rc)[0-9]+$'; then
            echo "Release $TAG is marked pre-release but $built is a final version" >&2
            exit 1
          fi

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  # Appends the API surface changes since the previous release to the
  # hand-written release notes, so no release ships without them.
  notes:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the baseline is the previous release tag

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Render API surface changes since the previous release
        run: uv run poe release-notes --out surface-notes.md

      - name: Append them to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --json body --jq .body > body.md
          # A rerun must not append the section twice.
          if grep -q '^## API surface changes' body.md; then exit 0; fi
          printf '\n\n## API surface changes\n\n' >> body.md
          cat surface-notes.md >> body.md
          gh release edit "$TAG" --notes-file body.md
