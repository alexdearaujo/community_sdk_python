[project]
name = "kentik-api"
version = "2.0.0"
description = "The modern Python SDK for the Kentik API v6"
readme = "README.md"
requires-python = ">=3.14"
license = {file = "LICENSE"}
authors = [
    { name = "Alex DeAraujo", email = "adearaujo@kentik.com" }
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

keywords = ["kentik", "api", "sdk", "networking", "observability"]

dependencies = [
    "python-dotenv>=1.1.1",
    "grpcio>=1.78.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
]

[project.urls]
Homepage = "https://github.com/kentik/community_sdk_python"
Documentation = "https://kb.kentik.com/docs/apis-overview"
Repository = "https://github.com/kentik/community_sdk_python"
"Issue Tracker" = "https://github.com/kentik/community_sdk_python/issues"
"Changelog" = "https://github.com/kentik/community_sdk_python/releases"

[build-system]
requires = ["uv_build>=0.10.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    "grpcio-tools>=1.78.0",
]

test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
]

docs = [
    "autodoc-pydantic>=2.2.0",
    "mkdocstrings[python]>=0.24.0",
    "myst-parser>=2.0.0",
    "sphinx>=9.1.0",
    "sphinx-book-theme>=1.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-plantuml>=0.31",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests against the real Kentik API. Opt-in only -- excluded by default, run with `-m e2e` or `make test-e2e`. Requires real KENTIK_EMAIL/KENTIK_API_TOKEN in a project-root .env.",
]
addopts = "-m 'not e2e'"
