[project]
name = "kentik-api"
dynamic = ["version"]
description = "The modern Python SDK for the Kentik API v6"
readme = "README.pypi.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Alex DeAraujo", email = "adearaujo@kentik.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

keywords = ["kentik", "api", "sdk", "networking", "observability"]

dependencies = [
    "python-dotenv>=1.2.4",
    "googleapis-common-protos>=1.73.1",
    "grpcio>=1.84.0",
    "protobuf>=7.35.1,<8",
    "httpx>=0.28.1,<1",
    "pydantic>=2.14.0",
]

[project.optional-dependencies]
analytics = [
    "pandas>=2.3",
    "pyarrow>=21",
    "pyyaml>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/kentik/community_sdk_python"
Documentation = "https://github.com/kentik/community_sdk_python/tree/main/docs"
Repository = "https://github.com/kentik/community_sdk_python"
"Issue Tracker" = "https://github.com/kentik/community_sdk_python/issues"
"Changelog" = "https://github.com/kentik/community_sdk_python/releases"

[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = [
    "/src/kentik_api",
    "/tests",
    "/README.md",
    "/README.pypi.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kentik_api"]

[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "docs"},
    "grpcio-tools==1.84.0",
    "types-protobuf>=6.30.0",
    "ty>=0.0.84",
    "ruff==0.17.1",
    "openapi-python-generator==2.1.2",
    "packaging>=24",
    "rumdl==0.3.0",
]

test = [
    "pytest>=9.0.2",
    "respx>=0.22.0",
    "jinja2>=3.1.6",
    # tests/analytics/ needs the extra, and must never skip for lack of it.
    "kentik-api[analytics]",
]

docs = [
    "autodoc-pydantic>=2.2.0",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-book-theme>=1.1.0",
    "sphinxcontrib-mermaid>=1.0.0",
]

[tool.ruff]
# Spec Kit owns these scripts and rewrites them on every upgrade.
extend-exclude = [".specify"]
# Ruff 0.17 also formats Markdown; generated pages under docs/sphinx/services/ must stay as the generator writes them.
include = ["*.py", "*.pyi", "*.ipynb", "**/pyproject.toml"]

[tool.ruff.lint]
# Ruff 0.14's default rules. Ruff 0.17 widened the default set; adopting it is a separate change.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
# protoc emits dependency imports that look unused but register those protos in
# the descriptor pool. Deleting them breaks AddSerializedFile at import time.
# They also sit below module-level statements, which is protoc's layout, not ours.
"src/kentik_api/gen/*/pb/*.py" = ["F401", "E402"]
"src/kentik_api/gen/pb_companions/**/*.py" = ["F401", "E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "e2e: end-to-end tests against the real Kentik API (REST transport). Opt-in only -- excluded by default, run with `-m e2e` or `make test-e2e`. Requires real KENTIK_EMAIL/KENTIK_API_TOKEN in a project-root .env.",
    "e2e_grpc: end-to-end tests against the real Kentik API (gRPC transport). Opt-in only -- excluded by default, run with `-m e2e_grpc` or `make test-e2e-grpc`. Requires real KENTIK_EMAIL/KENTIK_API_TOKEN in a project-root .env.",
    "e2e_mutating: end-to-end tests that WRITE to the real Kentik account, on disposable data with cleanup. Never part of make test-e2e: run with `-m e2e_mutating --run-live-e2e`.",
]
addopts = "-m 'not e2e and not e2e_grpc and not e2e_mutating'"

[tool.ty.src]
# Spec Kit's vendored scripts: upstream code that `specify` rewrites on upgrade.
exclude = [".specify"]

[tool.ty.environment]
# scripts/ is on sys.path when generate_sdk.py runs as a direct script
extra-paths = ["scripts"]

[[tool.ty.overrides]]
include = ["src/kentik_api/gen/**/*.pyi"]

[tool.ty.overrides.rules]
conflicting-metaclass = "ignore"
# protoc declares extension fields as module-level ClassVar.
invalid-type-form = "ignore"

[[tool.ty.overrides]]
# protoc's EXPERIMENTAL static helpers use grpc.experimental without importing
# it. The SDK calls stubs through channels and never uses those helpers.
include = ["src/kentik_api/gen/**/*_pb2_grpc.py"]

[tool.ty.overrides.rules]
possibly-missing-submodule = "ignore"
