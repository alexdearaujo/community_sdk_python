"device_bucket"><rect x="520" y="80" width="240" height="72" rx="14"/><text x="640.0" y="104.0" class="nm">Shared counter</text><text x="640.0" y="121.0" class="ft">device list</text><text x="640.0" y="138.0" class="ft">REST + gRPC</text></g><g class="node fam-orange src " data-id="rest_sites"><rect x="20" y="230" width="220" height="72" rx="14"/><text x="130.0" y="254.0" class="nm">REST request</text><text x="130.0" y="271.0" class="ft">site.ListSites</text><text x="130.0" y="288.0" class="ft">endpoint</text></g><g class="node fam-neutral hub " data-id="sites_bucket"><rect x="520" y="230" width="240" height="72" rx="14"/><text x="640.0" y="254.0" class="nm">Separate counter</text><text x="640.0" y="271.0" class="ft">site list</text><text x="640.0" y="288.0" class="ft">own budget</text></g><g class="node fam-red src " data-id="rest_markets"><rect x="20" y="320" width="220" height="72" rx="14"/><text x="130.0" y="344.0" class="nm">REST request</text><text x="130.0" y="361.0" class="ft">site.ListSiteMarkets</text><text x="130.0" y="378.0" class="ft">endpoint</text></g><g class="node fam-neutral hub " data-id="markets_bucket"><rect x="520" y="320" width="240" height="72" rx="14"/><text x="640.0" y="344.0" class="nm">Separate counter</text><text x="640.0" y="361.0" class="ft">site markets</text><text x="640.0" y="378.0" class="ft">own budget</text></g></svg>