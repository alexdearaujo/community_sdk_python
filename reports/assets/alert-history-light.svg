2" rx="14"/><text x="130.0" y="64.0" class="nm">REST AlertList</text><text x="130.0" y="81.0" class="ft">no startedAt</text><text x="130.0" y="98.0" class="ft">2026-10-13</text></g><g class="node fam-green src " data-id="rest_started"><rect x="20" y="130" width="220" height="72" rx="14"/><text x="130.0" y="154.0" class="nm">REST AlertList</text><text x="130.0" y="171.0" class="ft">with startedAt</text><text x="130.0" y="188.0" class="ft">2026-10-13</text></g><g class="node fam-neutral hub " data-id="rest_api"><rect x="470" y="80" width="200" height="72" rx="14"/><text x="570.0" y="112.5" class="nm">REST API</text><text x="570.0" y="129.5" class="ft">alert list</text></g><g class="node fam-red proc " data-id="rest_missing"><rect x="880" y="40" width="220" height="72" rx="14"/><text x="990.0" y="64.0" class="nm">HTTP 400</text><text x="990.0" y="81.0" class="ft">missing time filter</text><text x="990.0" y="98.0" class="ft">historical</text></g><g class="node fam-green proc " data-id="rest_success"><rect x="880" y="130" width="220" height="72" rx="14"/><text x="990.0" y="154.0" class="nm">HTTP 200</text><text x="990.0" y="171.0" class="ft">122 alerts</text><text x="990.0" y="188.0" class="ft">historical</text></g><g class="node fam-blue src " data-id="grpc_open"><rect x="20" y="250" width="220" height="72" rx="14"/><text x="130.0" y="274.0" class="nm">gRPC call</text><text x="130.0" y="291.0" class="ft">no deadline</text><text x="130.0" y="308.0" class="ft">2026-10-27</text></g><g class="node fam-orange src " data-id="grpc_deadline"><rect x="20" y="340" width="220" height="72" rx="14"/><text x="130.0" y="364.0" class="nm">gRPC call</text><text x="130.0" y="381.0" class="ft">deadline set</text><text x="130.0" y="398.0" class="ft">six services</text></g><g class="node fam-green proc " data-id="grpc_ok"><rect x="470" y="250" width="220" height="72" rx="14"/><text x="580.0" y="282.5" class="nm">Call succeeds</text><text x="580.0" y="299.5" class="ft">no deadline</text></g><g class="node fam-red proc " data-id="grpc_error"><rect x="470" y="340" width="260" height="72" rx="14"/><text x="600.0" y="364.0" class="nm">RangeError</text><text x="600.0" y="381.0" class="ft">six services</text><text x="600.0" y="398.0" class="ft">historical repro</text></g></svg>