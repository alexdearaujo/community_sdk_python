ss="ft">122 alerts</text><text x="1230" y="188.0" class="ft">historical</text></g><g class="node fam-blue proc " data-id="grpc_open"><rect x="260" y="250" width="220" height="72" rx="14"/><text x="370" y="274.0" class="nm">gRPC call</text><text x="370" y="291.0" class="ft">no deadline</text><text x="370" y="308.0" class="ft">2026-10-27</text></g><g class="node fam-orange proc " data-id="grpc_deadline"><rect x="260" y="340" width="220" height="72" rx="14"/><text x="370" y="364.0" class="nm">gRPC call</text><text x="370" y="381.0" class="ft">deadline set</text><text x="370" y="398.0" class="ft">six services</text></g><g class="node fam-green proc " data-id="grpc_ok"><rect x="710" y="250" width="220" height="72" rx="14"/><text x="820" y="282.5" class="nm">Call succeeds</text><text x="820" y="299.5" class="ft">no deadline</text></g><g class="node fam-red proc " data-id="grpc_error"><rect x="710" y="340" width="260" height="72" rx="14"/><text x="840" y="364.0" class="nm">RangeError</text><text x="840" y="381.0" class="ft">six services</text><text x="840" y="398.0" class="ft">historical repro</text></g><g class="node fam-neutral hub " data-id="probes"><rect x="20" y="190" width="180" height="72" rx="14"/><text x="110.0" y="214.0" class="nm">Read-only probes</text><text x="110.0" y="231.0" class="ft">REST 2026-10-13</text><text x="110.0" y="248.0" class="ft">gRPC 2026-10-27</text></g></svg>